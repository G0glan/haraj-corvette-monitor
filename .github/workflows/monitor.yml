name: Haraj Corvette Monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug API response
        run: python debug.py

      - name: Run monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python haraj_monitor.py

      - name: Commit seen_listings.json if changed
        run: |
          git config user.name "haraj-monitor-bot"
          git config user.email "bot@haraj-monitor"
          git add seen_listings.json
          if git diff --quiet HEAD -- seen_listings.json; then
            echo "No changes to seen_listings.json — skipping commit."
          else
            git commit -m "chore: update seen_listings.json [skip ci]"
            git push
          fi
